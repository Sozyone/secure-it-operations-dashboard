---
- name: Prepare local DevSecOps lab server
  hosts: local
  become: true

  tasks:
    - name: Install basic packages
      apt:
        name:
          - git
          - curl
          - nano
          - python3
          - python3-venv
          - python3-pip
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Allow SSH through firewall
      command: ufw allow OpenSSH
      changed_when: false

    - name: Enable firewall
      command: ufw --force enable
      changed_when: false

    - name: Enable fail2ban service
      service:
        name: fail2ban
        state: started
        enabled: true
